<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf5ff">
  <title>ETDOX | Secure Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(circle at top left, #d8efff, transparent 42%), #f4faff; }
    a, button, input { transition: all .2s ease; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #0284c7; outline-offset: 3px; }
  </style>
</head>
<body class="min-h-screen text-slate-900 flex items-center justify-center p-5">
  <main class="w-full max-w-md">
    <a href="index.html" class="mb-5 inline-flex items-center gap-2 text-sm text-slate-600 hover:text-sky-700"><span aria-hidden="true">←</span> Back to home</a>
    <div class="text-xl font-bold">ETDOX<span class="text-sky-600">.</span></div>
    <div class="mt-6 rounded-2xl border border-sky-100 bg-white p-8 shadow-xl shadow-sky-100/80">
      <p class="text-sm font-semibold tracking-widest text-sky-700">SECURE ACCESS</p>
      <h1 class="mt-3 text-3xl font-bold">Welcome back</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">Sign in to access your approved applications.</p>
      <form id="loginForm" class="mt-8 space-y-5">
        <div><label for="email" class="mb-2 block text-sm font-medium">Work email</label><input id="email" type="email" required autocomplete="username" placeholder="you@company.com" class="w-full rounded-lg border border-sky-200 bg-sky-50/60 p-3 outline-none focus:border-sky-500 focus:bg-white"></div>
        <div><label for="password" class="mb-2 block text-sm font-medium">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password" class="w-full rounded-lg border border-sky-200 bg-sky-50/60 p-3 outline-none focus:border-sky-500 focus:bg-white"></div>
        <button type="submit" class="w-full rounded-lg bg-sky-600 py-3 font-semibold text-white hover:bg-sky-700">Continue securely</button>
        <p id="message" role="status" class="text-sm text-amber-700"></p>
      </form>
      <p class="mt-6 text-center text-sm text-slate-600">New to the platform? <a href="request.html" class="font-semibold text-sky-700 hover:underline">Request access</a></p>
    </div>
    <p class="mt-5 text-center text-xs text-slate-500">ETDOX Zero-Trust · Identity-first security</p>
  </main>
  <script>document.getElementById("loginForm").addEventListener("submit", function(event) { event.preventDefault(); document.getElementById("message").textContent = "Demo only: connect Keycloak to enable secure sign-in."; });</script>
</body>
</html>
