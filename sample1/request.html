
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf5ff">
  <title>ETDOX | Request Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(circle at top left, #d8efff, transparent 42%), #f4faff; }
    a, button, input, textarea { transition: all .2s ease; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #0284c7; outline-offset: 3px; }
  </style>
</head>
<body class="min-h-screen text-slate-900 flex items-center justify-center p-5">

  <main class="w-full max-w-md">
    <a href="index.html" class="mb-5 inline-flex items-center gap-2 text-sm text-slate-600 hover:text-sky-700"><span aria-hidden="true">&larr;</span> Back to home</a>
    <div class="text-xl font-bold">ETDOX<span class="text-sky-600">.</span></div>

    <div class="mt-6 rounded-2xl border border-sky-100 bg-white p-8 shadow-xl shadow-sky-100/80">
      <p class="text-sm font-semibold tracking-widest text-sky-700">ACCESS MANAGEMENT</p>
      <h1 class="mt-3 text-3xl font-bold">Request access</h1>
      <p class="mt-3 text-sm leading-6 text-slate-600">
        Submit your details to request access to the platform.
      </p>

      <form id="requestForm" class="mt-8 space-y-5">
        <div>
          <label for="name" class="block text-sm mb-2">Full name</label>
          <input id="name" type="text" required
            autocomplete="name" placeholder="Your name"
            class="w-full rounded-lg border border-sky-200 bg-sky-50/60 p-3 outline-none focus:border-sky-500 focus:bg-white">
        </div>

        <div>
          <label for="email" class="block text-sm mb-2">Work email</label>
          <input id="email" type="email" required
            autocomplete="email" placeholder="you@company.com"
            class="w-full rounded-lg border border-sky-200 bg-sky-50/60 p-3 outline-none focus:border-sky-500 focus:bg-white">
        </div>

        <div>
          <label for="reason" class="block text-sm mb-2">Reason for access</label>
          <textarea id="reason" required rows="3"
            placeholder="Briefly describe your access requirement"
            class="w-full rounded-lg border border-sky-200 bg-sky-50/60 p-3 outline-none focus:border-sky-500 focus:bg-white"></textarea>
        </div>

        <button type="submit"
          class="w-full rounded-lg bg-sky-600 py-3 font-semibold text-white hover:bg-sky-700">
          Submit request
        </button>

        <p id="message" role="status"
           class="text-sm text-amber-700"></p>
      </form>

      <p class="mt-6 text-center text-sm text-slate-600">
        Already have access?
        <a href="login.html" class="font-semibold text-sky-700 hover:underline">Login</a>
      </p>
    </div>
  </main>

  <script>
    document.getElementById("requestForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Demo only: your request has not been sent or saved.";
    });
  </script>
</body>
</html>
