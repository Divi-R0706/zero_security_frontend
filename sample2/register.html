<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an ETDOX account">
    <title>Register | ETDOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            450: '#10a879',
                            550: '#07966b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 antialiased">
    <header class="border-b border-gray-100 bg-white">
        <nav class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-10">
            <a href="home.html" class="text-2xl font-bold tracking-tight text-gray-900">
                ETD<span class="text-emerald-600">OX</span>
            </a>
            <a href="login.html" class="text-sm font-semibold text-emerald-700 hover:text-emerald-800">Sign in</a>
        </nav>
    </header>
    <main class="mx-auto flex min-h-[calc(100vh-5rem)] max-w-md items-center px-6 py-12">
        <section class="w-full rounded-xl border border-gray-200 bg-white p-8 shadow-sm sm:p-10">
            <p class="text-sm font-semibold uppercase tracking-wide text-emerald-700">Get started</p>
            <h1 class="mt-2 text-3xl font-bold text-gray-900">Create your account</h1>
            <p class="mt-2 text-sm text-gray-500">Set up your ETDOX account to continue.</p>
            <form class="mt-8 space-y-5">
                <div>
                    <label for="name" class="mb-2 block text-sm font-medium text-gray-700">Full name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100">
                </div>
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-gray-700">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100">
                </div>
                <div>
                    <label for="password" class="mb-2 block text-sm font-medium text-gray-700">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100">
                </div>
                <button type="submit" class="w-full rounded-lg bg-emerald-600 px-4 py-3 font-semibold text-white transition hover:bg-emerald-700">Create account</button>
            </form>
            <p class="mt-6 text-center text-sm text-gray-600">Already registered? <a href="login.html" class="font-semibold text-emerald-700 hover:text-emerald-800">Sign in</a></p>
            <a href="home.html" class="mt-6 block text-center text-sm text-gray-500 hover:text-gray-800">Back to home</a>
        </section>
    </main>
</body>
</html>
