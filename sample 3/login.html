
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETDOX | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #080f1c; font-family: Arial, sans-serif; }
    .glow { box-shadow: 0 0 50px rgba(34, 211, 238, 0.08); }
  </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-4">

  <div class="glow w-full max-w-md p-8 rounded-2xl border border-gray-800 bg-gray-900/70">
    <a href="index.html" class="text-2xl font-bold tracking-wide">
      ETD<span class="text-cyan-400">OX</span>
    </a>

    <h1 class="text-3xl font-bold mt-8">Welcome back</h1>
    <p class="text-gray-400 mt-2">Sign in to your security portal.</p>

    <form class="mt-8 space-y-5"
          onsubmit="event.preventDefault(); alert('Demo only: Connect Keycloak to enable secure login.');">

      <div>
        <label for="email" class="block text-sm font-medium mb-2 text-gray-300">Email address</label>
        <input id="email" type="email" required
          placeholder="you@example.com"
          class="w-full border border-gray-700 bg-gray-800/70 text-white placeholder:text-gray-500 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-cyan-400">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-2 text-gray-300">Password</label>
        <input id="password" type="password" required
          placeholder="Enter your password"
          class="w-full border border-gray-700 bg-gray-800/70 text-white placeholder:text-gray-500 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-cyan-400">
      </div>

      <button type="submit"
        class="w-full bg-cyan-400 text-gray-950 p-3 rounded-lg font-semibold hover:bg-cyan-300 transition">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      Don't have an account?
      <a href="register.html" class="text-cyan-400 font-semibold hover:text-cyan-300">Register</a>
    </p>

    <a href="index.html" class="block text-center text-sm text-gray-400 mt-5 hover:text-cyan-400">
      ← Back to Home
    </a>
  </div>

</body>
</html>
